name: Deploy Cloudsnap

on:
  push:
    branches: [main]
  workflow_dispatch:  # allows manual runs too, e.g. to (re)apply bootstrap alone if needed

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::026344354643:role/github-actions
          aws-region: us-east-1

      - name: Check if Backend Exists
        id: check_backend
        run: |
          if aws s3api head-bucket --bucket cloudsnap-terraform-state-bucket 2>/dev/null; then
            echo "backend_exists=true" >> $GITHUB_OUTPUT
          else
            echo "backend_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create S3 Backend Bucket
        if: steps.check_backend.outputs.backend_exists == 'false'
        run: |
          # us-east-1 does NOT accept an explicit LocationConstraint --
          # passing one throws IllegalLocationConstraintException.
          aws s3api create-bucket \
            --bucket cloudsnap-terraform-state-bucket \
            --region us-east-1

          echo "Bucket created, waiting for it to be available..."
          sleep 2

          aws s3api put-bucket-versioning \
            --bucket cloudsnap-terraform-state-bucket \
            --versioning-configuration Status=Enabled \
            --region us-east-1

          aws s3api put-bucket-encryption \
            --bucket cloudsnap-terraform-state-bucket \
            --server-side-encryption-configuration '{
              "Rules": [{
                "ApplyServerSideEncryptionByDefault": {
                  "SSEAlgorithm": "aws:kms",
                  "KMSMasterKeyID": "arn:aws:kms:us-east-1:026344354643:alias/cloudsnap-terraform"
                },
                "BucketKeyEnabled": true
              }]
            }' \
            --region us-east-1

          aws s3api put-public-access-block \
            --bucket cloudsnap-terraform-state-bucket \
            --public-access-block-configuration '{
              "BlockPublicAcls": true,
              "IgnorePublicAcls": true,
              "BlockPublicPolicy": true,
              "RestrictPublicBuckets": true
            }' \
            --region us-east-1

          echo "S3 backend bucket created successfully"

      - name: Create DynamoDB Lock Table
        if: steps.check_backend.outputs.backend_exists == 'false'
        run: |
          aws dynamodb create-table \
            --table-name terraform-locks \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region us-east-1 \
            --sse-specification Enabled=true,SSEType=KMS,KMSMasterKeyId=arn:aws:kms:us-east-1:026344354643:alias/cloudsnap-terraform

          echo "Waiting for DynamoDB table to be created..."
          aws dynamodb wait table-exists --table-name terraform-locks --region us-east-1

          echo "DynamoDB lock table created successfully"

      - name: Apply S3 Bucket Policy
        if: steps.check_backend.outputs.backend_exists == 'false'
        run: |
          # AllowStateAccess intentionally has NO server-side-encryption
          # condition -- read actions (GetObject, ListBucket,
          # GetBucketVersioning) never send that header, so attaching the
          # condition there would silently block reads and break
          # `terraform init`/`plan`. Encryption is enforced separately by
          # DenyUnencryptedObjectUploads, which only applies to PutObject.
          cat > bucket-policy.json << 'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "AllowStateAccess",
                "Effect": "Allow",
                "Principal": {
                  "AWS": "arn:aws:iam::026344354643:role/github-actions"
                },
                "Action": [
                  "s3:GetObject",
                  "s3:PutObject",
                  "s3:DeleteObject",
                  "s3:ListBucket",
                  "s3:GetBucketVersioning"
                ],
                "Resource": [
                  "arn:aws:s3:::cloudsnap-terraform-state-bucket",
                  "arn:aws:s3:::cloudsnap-terraform-state-bucket/*"
                ]
              },
              {
                "Sid": "DenyUnencryptedObjectUploads",
                "Effect": "Deny",
                "Principal": "*",
                "Action": "s3:PutObject",
                "Resource": "arn:aws:s3:::cloudsnap-terraform-state-bucket/*",
                "Condition": {
                  "StringNotEquals": {
                    "s3:x-amz-server-side-encryption": "aws:kms"
                  }
                }
              },
              {
                "Sid": "DenyInsecureTransport",
                "Effect": "Deny",
                "Principal": "*",
                "Action": "s3:*",
                "Resource": [
                  "arn:aws:s3:::cloudsnap-terraform-state-bucket",
                  "arn:aws:s3:::cloudsnap-terraform-state-bucket/*"
                ],
                "Condition": {
                  "Bool": {
                    "aws:SecureTransport": "false"
                  }
                }
              }
            ]
          }
          EOF

          aws s3api put-bucket-policy \
            --bucket cloudsnap-terraform-state-bucket \
            --policy file://bucket-policy.json \
            --region us-east-1

          echo "Bucket policy applied successfully"

  deploy:
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::026344354643:role/github-actions
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create Lambda Deployment Packages
        run: |
          cd backend
          zip -r deployment_package.zip image_upload.py
          zip -r deployment_package_image.zip image_processor.py
          zip -r deployment_package_db_stream.zip db_metadata_query.py
          cd ..

      - name: Terraform Init
        run: terraform init -backend-config=backend-config.hcl

      - name: Verify Backend Configuration
        run: |
          echo "Checking backend initialization..."
          echo ""
          echo "Backend config file contents:"
          cat backend-config.hcl

          echo ""
          echo "Terraform backend status:"
          terraform backend show 2>&1 || echo "Backend not yet initialized with state"

          echo ""
          echo "Checking if S3 state file exists:"
          aws s3 ls s3://cloudsnap-terraform-state-bucket/prod/ || echo "No state file yet"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply (Create Infrastructure)
        run: terraform apply -auto-approve tfplan

      - name: Verify Terraform State
        run: |
          echo "Checking if state was saved to S3..."
          aws s3 ls s3://cloudsnap-terraform-state-bucket/prod/terraform.tfstate

          echo ""
          echo "Terraform state list:"
          terraform state list

          echo ""
          echo "S3 bucket contents:"
          aws s3 ls s3://cloudsnap-terraform-state-bucket/ --recursive

      - name: Deploy Frontend to S3
        run: |
          aws s3 sync ./frontend s3://cloudsnap-staticsite --delete

      - name: Update Upload Handler Lambda
        run: |
          cd backend
          aws lambda update-function-code \
            --function-name serverless-photo-app-lambda \
            --zip-file fileb://deployment_package.zip

      - name: Update Image Processor Lambda
        run: |
          cd backend
          aws lambda update-function-code \
            --function-name cloudsnap-image-processor-lambda \
            --zip-file fileb://deployment_package_image.zip

      - name: Update DB Query Lambda
        run: |
          cd backend
          aws lambda update-function-code \
            --function-name sharing_photos_group6 \
            --zip-file fileb://deployment_package_db_stream.zip