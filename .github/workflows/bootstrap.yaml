name: Bootstrap Terraform Backend

on:
  workflow_dispatch:  # Manual trigger only

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::026344354643:role/github-actions
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create Bootstrap Backend Config
        run: |
          cat > backend-bootstrap.hcl << 'EOF'
          # Empty backend config - will use local state for bootstrap
          EOF

      - name: Terraform Init (Local)
        run: terraform init -backend=false

      - name: Create S3 Backend Bucket
        run: |
          # Create S3 bucket
          aws s3api create-bucket \
            --bucket cloudsnap-terraform-state-bucket \
            --region us-east-1 \
            --create-bucket-configuration LocationConstraint=us-east-1 2>/dev/null || echo "Bucket may already exist"
          
          # Enable versioning
          aws s3api put-bucket-versioning \
            --bucket cloudsnap-terraform-state-bucket \
            --versioning-configuration Status=Enabled \
            --region us-east-1
          
          # Enable server-side encryption
          aws s3api put-bucket-encryption \
            --bucket cloudsnap-terraform-state-bucket \
            --server-side-encryption-configuration '{
              "Rules": [{
                "ApplyServerSideEncryptionByDefault": {
                  "SSEAlgorithm": "aws:kms",
                  "KMSMasterKeyID": "arn:aws:kms:us-east-1:026344354643:alias/cloudsnap-terraform"
                },
                "BucketKeyEnabled": true
              }]
            }' \
            --region us-east-1
          
          # Block public access
          aws s3api put-public-access-block \
            --bucket cloudsnap-terraform-state-bucket \
            --public-access-block-configuration '{
              "BlockPublicAcls": true,
              "IgnorePublicAcls": true,
              "BlockPublicPolicy": true,
              "RestrictPublicBuckets": true
            }' \
            --region us-east-1
          
          echo "S3 backend bucket created successfully"

      - name: Create DynamoDB Lock Table
        run: |
          aws dynamodb create-table \
            --table-name terraform-locks \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region us-east-1 \
            --sse-specification Enabled=true,SSEType=KMS,KMSMasterKeyId=arn:aws:kms:us-east-1:026344354643:alias/cloudsnap-terraform 2>/dev/null || echo "Table may already exist"
          
          # Wait for table to be active
          aws dynamodb wait table-exists --table-name terraform-locks --region us-east-1
          
          echo "DynamoDB lock table created successfully"

      - name: Apply S3 Bucket Policy
        run: |
          cat > bucket-policy.json << 'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "AllowStateAccess",
                "Effect": "Allow",
                "Principal": {
                  "AWS": "arn:aws:iam::026344354643:role/github-actions"
                },
                "Action": [
                  "s3:GetObject",
                  "s3:PutObject",
                  "s3:DeleteObject",
                  "s3:ListBucket",
                  "s3:GetBucketVersioning"
                ],
                "Resource": [
                  "arn:aws:s3:::cloudsnap-terraform-state-bucket",
                  "arn:aws:s3:::cloudsnap-terraform-state-bucket/*"
                ],
                "Condition": {
                  "StringEquals": {
                    "s3:x-amz-server-side-encryption": "aws:kms"
                  }
                }
              },
              {
                "Sid": "DenyUnencryptedObjectUploads",
                "Effect": "Deny",
                "Principal": "*",
                "Action": "s3:PutObject",
                "Resource": "arn:aws:s3:::cloudsnap-terraform-state-bucket/*",
                "Condition": {
                  "StringNotEquals": {
                    "s3:x-amz-server-side-encryption": "aws:kms"
                  }
                }
              },
              {
                "Sid": "DenyInsecureTransport",
                "Effect": "Deny",
                "Principal": "*",
                "Action": "s3:*",
                "Resource": [
                  "arn:aws:s3:::cloudsnap-terraform-state-bucket",
                  "arn:aws:s3:::cloudsnap-terraform-state-bucket/*"
                ],
                "Condition": {
                  "Bool": {
                    "aws:SecureTransport": "false"
                  }
                }
              }
            ]
          }
          EOF
          
          aws s3api put-bucket-policy \
            --bucket cloudsnap-terraform-state-bucket \
            --policy file://bucket-policy.json \
            --region us-east-1
          
          echo "Bucket policy applied successfully"

      - name: Summary
        run: |
          echo "✓ Bootstrap completed successfully!"
          echo ""
          echo "Backend Resources Created:"
          echo "  - S3 Bucket: cloudsnap-terraform-state-bucket"
          echo "  - DynamoDB Table: terraform-locks"
          echo "  - KMS Encryption: Enabled"
          echo ""
          echo "Next Steps:"
          echo "  1. Run the 'Deploy Cloudsnap' workflow to deploy infrastructure"
